[workspace]
resolver = "3"
# 桌面壳 (crates/desktop) 在 M3 加入: 它依赖 Tauri, 会把整条 BoringSSL 与 WebView 构建链
# 拉进默认构建, 首个切片先只验证 HTTP 契约与业务内核.
members = ["crates/core", "crates/crawlers", "crates/runtime", "crates/server", "crates/net"]
default-members = ["crates/core", "crates/crawlers", "crates/runtime", "crates/server", "crates/net"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
# 工作区内部包
amane-core = { path = "crates/core" }
amane-crawlers = { path = "crates/crawlers" }
amane-runtime = { path = "crates/runtime" }
amane-net = { path = "crates/net" }

# 序列化与校验
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }

# 基础设施
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
regex = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
async-trait = "0.1"
tokio-util = "0.7"

# 持久化
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "migrate",
    "macros",
] }

# 传输层
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
utoipa = { version = "6", features = ["chrono"] }
clap = { version = "4", features = ["derive"] }

# 测试
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
